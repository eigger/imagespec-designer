name: Release

# A published GitHub Release is publishable only when its v* tag matches
# pyproject.toml and the complete CI workflow succeeds.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check release tag against project version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["TAG_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match project version {version!r}")
          PY

  validate:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/imagespec-designer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
